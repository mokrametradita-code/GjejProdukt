}

.nav{

}

.hero-content{
  max-width:1100px;
  margin:auto;
}

.hero h1{
  font-size:42px;

}

.hero p{
  font-size:18px;

}

.whatsapp{

.container{

.categories{
  display:flex;

  flex-wrap:wrap;
  margin-bottom:30px;
}

.category{

  background:white;
  padding:12px 18px;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
  box-shadow:0 2px 8px rgba(0,0,0,.06);
}

.category:hover{
  background:#1268e8;
  color:white;
}

.title{
  font-size:28px;
  margin-bottom:20px;
}

.products{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:20px;
}

.product{

  border-radius:14px;
  overflow:hidden;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
  transition:.2s;
}

.product:hover{
  transform:translateY(-3px);
}

.product-image{
  height:210px;
  background:#eef1f5;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:70px;
}

.product-info{
  padding:16px;
}

.product h3{
  font-size:17px;
  margin-bottom:8px;
}

.product p{
  color:#667085;
  font-size:14px;
  margin-bottom:12px;
}

.price{
  font-size:20px;
  font-weight:bold;
  color:#1268e8;
  margin-bottom:12px;
}

.order{
  display:block;
  text-align:center;
  background:#25d366;
  color:white;
  text-decoration:none;
  padding:10px;
  border-radius:8px;
  font-weight:bold;
}
